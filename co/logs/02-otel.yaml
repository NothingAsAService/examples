apiVersion: v1
kind: ConfigMap
metadata:
  name: hotrod-otel-config
  namespace: meomeo-ns
data:
  config.yaml: |
    receivers:
      filelog/hotrod:
        include:
          - /var/log/containers/*_meomeo-ns_hotrod-*.log
        start_at: beginning
        include_file_path: true
        include_file_name: true
        operators:
          - type: container
          - type: regex_parser
            id: hotrod_parser
            regex: '^(?P<timestamp>\S+)\s+(?P<severity>\S+)\s+(?P<caller>\S+)\s+(?P<message>.*?)\s+(?P<json>\{.*\})$'
          - type: time_parser
            parse_from: attributes.timestamp
            layout: '2006-01-02T15:04:05.999Z07:00'
          - type: severity_parser
            parse_from: attributes.severity
          - type: json_parser
            parse_from: attributes.json
            parse_to: attributes
          - type: remove
            field: attributes.timestamp
          - type: remove
            field: attributes.severity
          - type: remove
            field: attributes.json
    processors:
      batch:
        send_batch_size: 512
        timeout: 5s
    exporters:
      debug:
        verbosity: detailed
      opensearch:
        http:
          endpoint: https://ingest-vnc1.viettelcloud.vn:8443/logging
          headers:
            Authorization: "X-CloudObser-Key <co_token>"
        logs_index: <co_log_store>
        logs_index_fallback: default
        sending_queue:
          enabled: true
    service:
      pipelines:
        logs:
          receivers:
            - filelog/hotrod
          processors:
            - batch
          exporters:
            - debug
            - opensearch
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hotrod-otel-collector
  namespace: meomeo-ns
spec:
  selector:
    matchLabels:
      app: hotrod-otel-collector
  template:
    metadata:
      labels:
        app: hotrod-otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          args:
            - "--config=/conf/config.yaml"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hotrod-otel-config
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
            type: Directory
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory